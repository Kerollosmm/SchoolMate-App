name: school_management_system
description: A new Flutter project.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.0.0 <4.0.0'
dependencies:
  cloud_firestore: ^4.15.5
  cupertino_icons: ^1.0.8
  custom_navigation_bar: ^0.8.2
  dio: ^5.4.0
  excel: ^4.0.0
  file_picker: ^6.0.0
  firebase_auth: ^4.17.4
  firebase_core: ^2.27.0
  firebase_messaging: ^14.7.15
  firebase_storage: ^11.6.9
  flutter:
    sdk: flutter
  flutter_dotenv: ^5.1.0
  flutter_downloader: ^1.11.6
  flutter_easyloading: ^3.0.5
  flutter_launcher_icons: ^0.13.1
  flutter_local_notifications: ^17.0.0
  flutter_phoenix: ^1.1.1
  flutter_screenutil: ^5.9.0
  flutter_svg: ^2.0.10
  flutter_zoom_drawer: ^3.1.1
  get: ^4.6.6
  get_storage: ^2.1.1
  google_fonts: ^6.1.0
  google_sign_in: ^6.2.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  image_picker: ^1.0.7
  intl: ^0.19.0
  open_file_plus: ^3.3.0
  path_provider: ^2.1.2
  permission_handler: ^11.3.0
  rounded_loading_button: ^2.1.0
  shimmer: ^3.0.0
  table_calendar: ^3.1.0
  url_launcher: ^6.2.5
  uuid: ^4.3.3
  youtube_player_flutter: ^9.0.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/LOGO2.jpg"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - .env
  fonts:
    - family: RedHatDisplay-Bold
      fonts:
        - asset: assets/fonts/RedHatDisplay-Bold.ttf
    - family: RedHatDisplay-Light
      fonts:
        - asset: assets/fonts/RedHatDisplay-Light.ttf
    - family: RedHatDisplay-Medium
      fonts:
        - asset: assets/fonts/RedHatDisplay-Medium.ttf
    - family: RedHatDisplay-Regular
      fonts:
        - asset: assets/fonts/RedHatDisplay-Regular.ttf
    - family: SFProDisplay-Bold
      fonts:
        - asset: assets/fonts/SFProDisplay-Bold.otf
    - family: SFProDisplay-Medium
      fonts:
        - asset: assets/fonts/SFProDisplay-Medium.OTF
    - family: SFProDisplay-Regular
      fonts:
        - asset: assets/fonts/SFProDisplay-Regular.OTF
