name: csms_app
description: Church Servants Management System - Phase 1
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=2.19.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  cloud_firestore: ^6.1.1

  # State Management & DI
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5
  get_it: ^9.2.0

  # Local Storage & Offline
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Utils
  connectivity_plus: ^7.0.0
  uuid: ^4.5.2
  intl: ^0.20.2
  rxdart: ^0.28.0

  # File & Share
  excel: ^4.0.0
  file_picker: ^10.3.8
  share_plus: ^12.0.1
  path_provider: ^2.0.15

  # UI
  cupertino_icons: ^1.0.2
  google_fonts: ^7.0.0
  fluttertoast: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.0
  build_runner: ^2.4.6
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
